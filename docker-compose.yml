name: st_smart_test

services:
  mysql:
    image: mysql:8.0
    container_name: st_smart_test_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-st_smart_test}
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - st_smart_test_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    image: st_smart_test_backend:latest
    container_name: st_smart_test_backend
    ports:
      - "${BACKEND_PORT:-8000}:80"
    environment:
      DATABASE_URL: "mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-st_smart_test}"
      DATABASE_NAME: "${MYSQL_DATABASE:-st_smart_test}"
      APP_TITLE: "${APP_TITLE:-智测}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      ROOT_PATH: "${ROOT_PATH:-}"
      SECRET_KEY: "${SECRET_KEY:-local-compose-secret-change-in-production}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}"
      ACCESS_TOKEN_EXPIRE_MINUTES_REMEMBER: "${ACCESS_TOKEN_EXPIRE_MINUTES_REMEMBER:-10080}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:3000}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-*}"
      AMAP_WEB_SERVICE_KEY: "${AMAP_WEB_SERVICE_KEY:-}"
      OSS_ENABLED: "${OSS_ENABLED:-false}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_URL_PREFIX: "${OSS_URL_PREFIX:-}"
      DEBUG: "${DEBUG:-true}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-true}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      SCHEDULER_POLL_SECONDS: "${SCHEDULER_POLL_SECONDS:-30}"
      SCHEDULER_MAX_CONCURRENT: "${SCHEDULER_MAX_CONCURRENT:-3}"
      SCHEDULE_POLICY_DEFAULT_MAX_REFERENCES: "${SCHEDULE_POLICY_DEFAULT_MAX_REFERENCES:-3}"
      AI_PLATFORM_MAX_CONCURRENT: "${AI_PLATFORM_MAX_CONCURRENT:-3}"
      FILE_MOUNT_ROOT: "${FILE_MOUNT_ROOT:-/mnt}"
      ALLOW_DESTRUCTIVE_MIGRATIONS: "${ALLOW_DESTRUCTIVE_MIGRATIONS:-false}"
      # Docker 启动统一使用项目根目录 .env，不读取挂载进容器的 backend/.env
      ENV_FILE: /dev/null
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - st_smart_test_network
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      # Windows 盘符挂载（macOS/Linux 下不适用）
      # - c:/:/mnt/c:ro
      # - d:/:/mnt/d:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:80/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: >
      sh -c "python init_db.py && uvicorn main:app --host 0.0.0.0 --port 80"

  frontend:
    build: ./frontend
    image: st_smart_test_frontend:latest
    container_name: st_smart_test_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - st_smart_test_network

volumes:
  mysql_data:
  uploads:

networks:
  st_smart_test_network:
    name: st_smart_test_network
    driver: bridge
